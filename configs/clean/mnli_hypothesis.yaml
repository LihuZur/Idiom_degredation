dataset: mnli_hypothesis
seed: 0

hf_revision: da70db2af9d09693783c3320c4249840212ee221

# RQ3 §4: hypotheses run shorter than premises (~10-25 words vs ~15-60), so the
# band is loosened at both ends relative to configs/clean/mnli.yaml's 10-100
# (author's call, 2026-09-12 — see paper_preparations/RQ3_position_variation.md §8).
length:
  min_tokens: 5
  max_tokens: 60

# D6: uncapped, mirroring configs/clean/mnli.yaml — MNLI is the only dataset
# where the manipulation acts directly on the decision.
max_rows: null

normalize:
  - nfc
  - collapse_whitespace

# Effectively premise-level: `data/mnli.py::MnliHypothesisLoader` already emits
# one row per promptID (same selection as `mnli`).
dedupe: true
