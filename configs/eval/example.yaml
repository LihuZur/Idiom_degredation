# Stage 3 (evaluation) config — one file per model pair lives
# here as configs/eval/{model}.yaml. This example.yaml documents
# the schema.

model: qwen3.5-1.5b-instruct  # Must match a name registered in models/registry.py
seed: 0
precision: bf16               # Optional: fp32, fp16, bf16 (defaults to model default_precision, forces fp32 on CPU)

# Deterministic decoding for eval (README §11, §6).
decoding:
  temperature: 0.0
  max_new_tokens: 32
  do_sample: false

# Batching. Runner picks device via models.device.select_device()
# and falls back to fp32 on CPU (README §9.4).
batch:
  size: 8
