# Stage 2 (augmentation) config for sst2. See configs/augment/example.yaml
# for the full annotated schema.

dataset: sst2
seed: 0

augmenter: gemini
augmenter_model: gemini-3.6-flash

decoding:
  temperature: 0.7
  max_output_tokens: 1536

judge:
  temperature: 0.0
  max_output_tokens: 512

retry:
  max_attempts: 3
  backoff_seconds: 2.0

prompts:
  paraphrase: paraphrase_v1.txt
  idiomatic:  idiomatic_v1.txt

validators:
  semantic_similarity:
    embedding_model: null
    min_cosine: 0.80
  label_preservation:
    method: llm_judge
  idiom_presence:
    method: llm_judge
  idiom_absence:
    method: llm_judge

cache:
  enabled: true
  dir: .hf_cache/augment
