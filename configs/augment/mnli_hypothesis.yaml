# Stage 2 (augmentation) config for the RQ3 mnli_hypothesis position-variation
# variant. Mirrors configs/augment/mnli.yaml exactly (same augmenter, model,
# decoding, retry, validators) — only the prompts differ, pointing at the
# hypothesis-rewrite templates instead of the premise ones.

dataset: mnli_hypothesis
seed: 0

augmenter: gemini
# Same choice as configs/augment/mnli.yaml, for cost/speed consistency with Ch. 1.
augmenter_model: gemini-3.5-flash-lite

decoding:
  temperature: 0.7
  max_output_tokens: 1536

judge:
  temperature: 0.0
  max_output_tokens: 512

retry:
  # Bumped from the default (3 attempts / 2.0s base) 2026-09-15: the free-tier
  # Gemini quota is 15 requests/min, and the default backoff (2s+4s≈6s total)
  # is too short to ride out a 60s rate-limit window, so the run paused on
  # almost every invocation. 5 attempts / 8s base gives sleeps of
  # 8+16+32+64=120s, comfortably past a minute-boundary reset.
  max_attempts: 5
  backoff_seconds: 8.0

# RQ3 §5.1: hypothesis-rewrite templates (premise is now the fixed reference,
# rendered via augmentation/prompts/loader.py's `{context}` premise block).
prompts:
  paraphrase: paraphrase_nli_hypothesis_v1.txt
  idiomatic:  idiomatic_nli_hypothesis_v1.txt

validators:
  semantic_similarity:
    embedding_model: null
    min_cosine: 0.80
  label_preservation:
    method: llm_judge
  idiom_presence:
    method: llm_judge
  idiom_absence:
    method: llm_judge

cache:
  enabled: true
  dir: .hf_cache/augment
